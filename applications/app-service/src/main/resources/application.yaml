server:
  port: 8080
spring:
  application:
    name: "crediya-autenticacion-ms"
  devtools:
    add-properties: false
  datasource:
    url: "jdbc:postgresql://localhost:5432/crediya_db"
    username: "postgres"
    password: "${POSTGRES_PASSWORD:}"
    driverClassName: "org.postgresql.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"